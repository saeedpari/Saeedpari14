<!DOCTYPE html><html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>صدف دوستت دارم</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Lalezar&display=swap');* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: linear-gradient(135deg, #ff9a9e, #fad0c4);
  overflow: hidden;
  font-family: 'Lalezar', cursive;
}

.container {
  position: relative;
  width: 90%;
  max-width: 900px;
  border-radius: 30px;
  overflow: hidden;
  box-shadow: 0 15px 40px rgba(0,0,0,0.25);
}

.container img {
  width: 100%;
  height: auto;
  display: block;
  filter: brightness(0.7);
}

.text {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  color: white;
  font-size: clamp(2.5rem, 7vw, 6rem);
  text-shadow: 0 0 15px rgba(255,255,255,0.7),
               0 0 30px rgba(255,0,128,0.7),
               0 0 45px rgba(255,0,128,0.5);
  animation: glow 2s infinite alternate;
  text-align: center;
  padding: 20px;
}

@keyframes glow {
  from {
    transform: translate(-50%, -50%) scale(1);
  }
  to {
    transform: translate(-50%, -50%) scale(1.05);
  }
}

.hearts {
  position: absolute;
  width: 100%;
  height: 100%;
  top: 0;
  left: 0;
  pointer-events: none;
}

.heart {
  position: absolute;
  color: rgba(255,255,255,0.8);
  animation: float 6s linear infinite;
  font-size: 24px;
}

@keyframes float {
  0% {
    transform: translateY(100vh) scale(0.5);
    opacity: 0;
  }
  20% {
    opacity: 1;
  }
  100% {
    transform: translateY(-120vh) scale(1.5);
    opacity: 0;
  }
}

  </style>
</head>
<body>  <div class="container">
    <img src="https://images.unsplash.com/photo-1518199266791-5375a83190b7?q=80&w=1600&auto=format&fit=crop" alt="love background"><div class="text">
  صدف دوستت دارم ❤️
</div>

<div class="hearts" id="hearts"></div>

  </div>  <script>
    const heartsContainer = document.getElementById('hearts');

    function createHeart() {
      const heart = document.createElement('div');
      heart.classList.add('heart');
      heart.innerHTML = '❤';
      heart.style.left = Math.random() * 100 + '%';
      heart.style.animationDuration = (Math.random() * 3 + 3) + 's';
      heart.style.fontSize = (Math.random() * 20 + 20) + 'px';

      heartsContainer.appendChild(heart);

      setTimeout(() => {
        heart.remove();
      }, 6000);
    }

    setInterval(createHeart, 300);
  </script></body>
</html>
